# Auto build + publish NewWave to welcomra1n/newwave-releases.
# Triggers when package.json changes on main (i.e. a version bump) or manually.
# electron-builder skips publishing if the release for that version already exists,
# so an unrelated package.json edit is harmless.
#
# One-time setup (Settings > Secrets and variables > Actions):
#   RELEASE_TOKEN         - a PAT (classic, repo scope) with write access to welcomra1n/newwave-releases
#   MAC_CSC_LINK          - (optional) base64 of your Apple Development .p12 cert; needed for mac auto-update
#   MAC_CSC_KEY_PASSWORD  - (optional) password for that .p12
# Also enable Actions: Settings > Actions > General > Allow all actions.

name: Release NewWave

on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

jobs:
  release:
    # Windows only: CI can't sign the mac build (no Apple cert on the runner), and an
    # unsigned mac asset breaks mac auto-update signature validation. Build mac locally
    # (where the Apple Development cert lives). Add macos-latest here only once
    # MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD secrets are configured.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Zig (Windows CGO)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          ZIG_VER=0.14.1
          curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-x86_64-windows-${ZIG_VER}.zip" -o zig.zip
          unzip -q zig.zip
          echo "$PWD/zig-x86_64-windows-${ZIG_VER}" >> "$GITHUB_PATH"

      - name: Install deps
        run: npm install

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: task package -- -p always
